<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pumpParse — вход</title>
<style>
  :root{--bg:#0e1117;--fg:#e6edf3;--dim:#8b949e;--line:#232a35;--acc:#3fb950;--err:#f85149}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  form{width:100%;max-width:320px;padding:28px;border:1px solid var(--line);
       border-radius:10px;background:#11161f}
  h1{margin:0 0 20px;font-size:22px;font-weight:600}
  h1 span{color:var(--acc)}
  label{display:block;margin-bottom:6px;color:var(--dim);font-size:12px}
  input{width:100%;margin-bottom:14px;padding:9px 10px;border:1px solid var(--line);
        border-radius:6px;background:#0e1117;color:var(--fg);font-size:14px}
  input:focus{outline:none;border-color:var(--acc)}
  button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--acc);
         color:#0e1117;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{display:none;margin-bottom:14px;padding:8px 10px;border-radius:6px;
       background:#2d1418;color:var(--err);font-size:13px}
</style>
<form id="f" autocomplete="on">
  <h1>pump<span>Parse</span></h1>
  <div class="err" id="err"></div>
  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Войти</button>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'),
      btn = document.getElementById('b');

// Куда вернуть после входа. Проверять префикс строкой нельзя: браузер в
// http(s)-ссылках считает обратный слэш обычным, и '/\evil.com' уезжает на
// чужой origin, хотя начинается с одного слэша. Поэтому разбираем адрес тем
// же парсером, что и браузер, и сверяем origin.
function safeNext(next) {
  try {
    const u = new URL(next || '/', location.origin);
    if (u.origin !== location.origin) return '/';
    return u.pathname + u.search + u.hash;
  } catch (e) {
    return '/';
  }
}
f.onsubmit = async e => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: f.username.value, password: f.password.value})
    }).then(x => x.json());
    if (r.error) throw new Error(r.error);
    // next приходит из редиректа сервера: возвращаем туда, откуда выкинуло.
    location.href = safeNext(new URLSearchParams(location.search).get('next'));
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
    f.password.value = '';
    f.password.focus();
  } finally {
    btn.disabled = false;
  }
};
</script>
